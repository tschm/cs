[project]
name = "cs"
version = "1.2.3"
description = "Companion materials for the Computational Statistics project."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Thomas Schmelzer" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "marimo>=0.23.16",
    "numpy>=2.4.6",
    "polars>=1.43.2",
    "plotly>=6.9.0",
    "jquantstats>=0.10.0",
    "tinycta>=0.14.0",
    "optuna>=4.9.0",
]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://tschm.github.io/cs"
Repository = "https://github.com/tschm/cs"

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.bumpversion]
# Without a table in a file bump-my-version actually discovers (.bumpversion.toml,
# .bumpversion.cfg, setup.cfg, pyproject.toml) the tool does not fail — it falls back
# to `git describe` and reports the last reachable tag as the current version, so a
# release can be cut at a version that has already been published.
#
# No `current_version` here on purpose: bump-my-version reads and rewrites PEP 621
# [project].version natively, so the version string stays declared in exactly one
# place and cannot go stale.
allow_dirty = false
# The release flow commits and tags itself, so the generated changelog lands in the
# same commit as the version bump. A bare `bump-my-version bump` would otherwise add
# a second commit and a duplicate tag.
commit = false
tag = false

[tool.rhiza-task]
# Settings recovered from the make layer that rhiza v1.4.0 retired. Each one differs
# from `rhiza-task`'s own default, so dropping it would silently weaken a gate rather
# than fail loudly. Everything the make layer set that *matched* the CLI default is
# listed at the bottom as "not set, on purpose" so it does not get re-added.

# Was: `SOURCE_FOLDER := book/marimo/notebooks` in .rhiza/make.d/custom-env.mk.
# CLI default: "src". This repo is a marimo book, not a src/ library -- the importable
# modules live under book/marimo/notebooks and there is no src/ tree at all. Without
# this, typecheck, bandit, docs-coverage, deptry and the coverage gate all point at a
# directory that does not exist and pass by scanning nothing.
source_folder = "book/marimo/notebooks"

# Was: `COVERAGE_FAIL_UNDER ?= 100` in .rhiza/make.d/custom-env.mk.
# CLI default: 90. [tool.coverage.report] does not stand in for this: the test task
# passes --cov-fail-under on the command line, which outranks the config file. Marimo's
# structural cell `return`s and the CLI guard are excluded in [tool.coverage.report],
# so every remaining executable line really is covered -- hold the gate at 100.
coverage_fail_under = 100

# Was: `TYPECHECKER ?= both` in .rhiza/make.d/python.mk.
# CLI default: "ty" alone, which drops `mypy --strict` entirely. Note this is also
# stricter than the make layer was: the old shell `case` let mypy's exit status win, so
# a `ty` failure could still pass.
typechecker = "both"

# Was: `RHIZA_CHECKS_VERSION ?= 0.2.1` in .rhiza/make.d/quality.mk, consumed as
# `--with 'pytest-rhiza==0.2.1'`. CLI default: the git ref v0.2.0. Keeping the repo on
# the version its checks were actually green against, rather than silently rolling back.
pytest_rhiza = "pytest-rhiza==0.2.1"

# Not set, on purpose -- the make layer's value already equals the CLI default, and
# naming a setting *replaces* the default rather than adding to it:
#   mkdocs_extra_packages  the old root Makefile said `--with 'mkdocstrings[python]'`,
#                          which is now the default list. Restating it would make this
#                          the line someone edits to add a package, dropping
#                          mkdocstrings from the book build in the process.
#   rhiza_checks           resolves from `layers = ["python"]` to the same five checks
#                          the make layer accumulated (test_readme, test_release_tags,
#                          test_readme_validation, test_pyproject, test_docstrings).
#   license_ignore_packages  marimo.mk appended `docutils`; rhiza-task appends it itself
#                          whenever marimo is in the task registry.
#   deptry_ignore          marimo.mk's `--ignore DEP004` was gated on MARIMO_FOLDER
#                          existing, and it never did -- so it was never in effect.
#   ci_os_matrix           ["ubuntu-latest"], marimo_folder "docs/notebooks",
#   tests_folder "tests", uv_sync_args "--all-extras --all-groups",
#   zensical_version ">=0.0.36", book_output "_book",
#   license_fail_on "GPL;LGPL;AGPL", layers ["python"] -- all identical to the default.

[tool.deptry]
package_module_name_map = { marimo = "marimo", numpy = "numpy", polars = "polars", plotly = "plotly" }

[tool.mypy]
mypy_path = "book/marimo/notebooks"
strict = true

[[tool.mypy.overrides]]
# No type stubs published for these.
module = ["jquantstats.*", "tinycta.*", "plotly.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The Experiment*.py notebooks are marimo-generated. Their hand-written logic — the
# ``f`` signal functions and the Experiment 5 DCC helpers — is fully checked under
# --strict. What is deliberately *not* checked is the generated cell scaffolding:
# marimo emits every cell as a ``@app.cell``-decorated ``_(...)`` function with no
# annotations, and annotating that generated ``def _()`` boilerplate by hand would
# be wiped the next time marimo rewrites the notebook, so it buys no lasting safety.
# ``no-untyped-def`` is the only error code those generated cells raise, so we
# disable just that code for these modules — rather than excluding the whole files —
# keeping the real strategy logic under the type checker. Behaviour is additionally
# pinned end-to-end by the Sharpe regression tests (tests/test_notebook_sharpe.py).
module = ["Experiment1", "Experiment2", "Experiment3", "Experiment4", "Experiment5"]
disable_error_code = ["no-untyped-def"]

[tool.coverage.run]
# Measure branch coverage, not just line coverage, so a conditional that is only
# ever taken one way (e.g. a guard whose else-branch is never exercised) is
# reported as a partial branch rather than counting as fully covered.
branch = true
# The notebook regression tests execute each marimo notebook in a spawned
# child process for isolation. Without subprocess tracking, the cell bodies
# they run would not be counted. parallel+multiprocessing+patch let coverage
# follow those children and combine their data with the parent run.
parallel = true
concurrency = ["multiprocessing"]
sigterm = true
patch = ["subprocess"]
# Scope measurement to the notebooks. The spawn start method re-imports the
# test module in each child to locate the worker function; without this the
# child would also report the test file itself.
#
# scripts/ is deliberately NOT listed here (issue #516). `make test` passes
# --cov=${SOURCE_FOLDER}, which replaces this list as coverage's measurement
# scope, so adding scripts/ here does not get it measured — it only gets it
# *reported*, at 0%, which fails the 100% gate for a purely cosmetic reason.
# The gate scripts are held to their own 100% bar by the
# "scripts/ unit tests at 100% coverage" pre-commit hook instead.
source = ["book/marimo/notebooks"]

[tool.coverage.report]
exclude_also = [
    # marimo emits a trailing `return <outputs>` in every generated @app.cell to
    # declare that cell's dataflow edges. Its runtime compiles the cell body
    # without that statement, so these lines are structurally unexecutable.
    "^\\s*return$",
    "^\\s*return [\\w, ]+$",
    # CLI entry guard: main() is covered through the API (test_main_*), not by
    # re-running the module as a subprocess.
    "if __name__ == .__main__.:",
]

[tool.interrogate]
# Marimo notebooks define anonymous cells as functions named "_"; those are
# generated structure, not API, so they are exempt from docstring coverage.
ignore-regex = ["^_$"]
fail-under = 100

[tool.check_test_layout]
# This project has no ``src/`` tree: its source is the marimo notebook set under
# book/marimo/notebooks, and tests/ mirrors *those*. Pointed at the default src/,
# the generic parity checker reports every test as an orphan; pointed at the real
# root it still flags the two deviations this project makes deliberately — the
# cross-cutting integration test (test_notebook_sharpe.py drives all five notebooks
# end-to-end, so it mirrors no single module) and the use of plain pytest functions
# rather than mirrored ``Test*`` classes, which is idiomatic pytest.
#
# Parity is therefore enforced by the repo-local gate scripts/check_test_layout.py,
# wired in as the "Tests mirror the marimo notebooks 1:1" pre-commit hook, which
# understands the actual layout. Per-module coverage is guaranteed independently by
# the full line-and-branch coverage gate in [tool.coverage] / make test.
enforce = false
reason = "No src/ tree — source is the marimo notebooks under book/marimo/notebooks. Parity is enforced by scripts/check_test_layout.py (pre-commit hook 'Tests mirror the marimo notebooks 1:1'); per-module coverage is guaranteed by the full coverage gate."

[dependency-groups]
test = [
    "pytest>=9.1.1",
]
