# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Pin node so pre-commit provisions a compatible runtime instead of using the
# system node. Some npm-based hooks (markdownlint-cli) pull transitive deps that
# reject odd-numbered current node releases (e.g. v25), failing on EBADENGINE.
default_language_version:
  node: "24.12.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        args: ['--unsafe']
        exclude: ^recipe/meta\.yaml$

  - repo: local
    hooks:
      - id: no-python-cache-files
        name: Prevent committing Python cache files
        language: fail
        entry: Python cache files (__pycache__, .pyc, .pyo, .pyd) must not be committed. Run 'make clean' to remove them.
        files: '(/__pycache__/|\.py[cod]$)'

      - id: no-rej-files
        name: Reject .rej files
        entry: "bash -c 'find . -type f -name \"*.rej\" | grep -q . && { echo \"ERROR: .rej files detected\"; find . -type f -name \"*.rej\"; exit 1; } || exit 0'"
        language: system
        pass_filenames: false

      - id: check-inline-pins
        name: Notebook PEP 723 pins match uv.lock
        entry: python3 scripts/check_inline_pins.py
        language: system
        pass_filenames: false
        files: '^(book/marimo/notebooks/.*\.py|uv\.lock)$'

      - id: check-test-layout
        name: Tests mirror the marimo notebooks 1:1
        entry: python3 scripts/check_test_layout.py
        language: system
        pass_filenames: false
        files: '^(book/marimo/notebooks/.*\.py|tests/.*\.py)$'

      # `make typecheck` runs mypy over ${SOURCE_FOLDER} only, and rhiza's recipe
      # guards that with `[ -d "${SOURCE_FOLDER}" ]` — a single-directory test, so
      # scripts/ cannot be appended to it. Passing paths on the command line also
      # overrides [tool.mypy] files, so declaring them there would not help either.
      # This hook is what holds the gate scripts to the same --strict bar as the
      # notebooks (issue #516). Settings still come from [tool.mypy].
      - id: mypy-scripts
        name: mypy --strict over scripts/
        entry: uv run --with mypy mypy --strict scripts
        language: system
        pass_filenames: false
        files: '^scripts/.*\.py$'

      # Coverage for the gate scripts, for the same reason as the hook above:
      # `make test` passes --cov=${SOURCE_FOLDER}, which *replaces* the source
      # list in [tool.coverage.run], so scripts/ cannot be folded into the main
      # coverage gate. This runs their unit tests under their own 100% bar.
      - id: pytest-scripts-coverage
        name: scripts/ unit tests at 100% coverage
        entry: >-
          uv run --with pytest --with pytest-cov --with pytest-timeout
          pytest tests/test_check_test_layout.py tests/test_check_inline_pins.py
          --cov=scripts --cov-branch --cov-fail-under=100
          --cov-report=term-missing -q -p no:cacheprovider
        language: system
        pass_filenames: false
        files: '^(scripts/.*\.py|tests/test_check_.*\.py)$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.16.2'
    hooks:
      - id: ruff
        args: [ --fix, --exit-non-zero-on-fix, --unsafe-fixes ]

      # Run the formatter
      - id: ruff-format

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.0
    hooks:
      - id: markdownlint
        args: ["--disable", "MD013"]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-renovate
        args: [ "--verbose" ]

      - id: check-github-workflows
        args: ["--verbose"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        # Scope deliberately lives in .bandit, not here — see that file (#1493).
        args: ["--ini", ".bandit"]

  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.7.4
    hooks:
      - id: betterleaks

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.3
    hooks:
      - id: uv-lock

  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: [--config=pyproject.toml]
        files: ^(book/marimo/notebooks/|tests/|scripts/).*\.py$

  - repo: https://github.com/Jebel-Quant/rhiza-hooks
    rev: v1.2.0  # Use the latest release
    hooks:
      # Migrated from rhiza
      - id: check-rhiza-workflow-names
      - id: update-readme-help
      # Additional utility hooks
      - id: check-rhiza-config
      - id: check-makefile-targets
      - id: check-python-version-consistency
      # check-bumpversion-config asserts that bump-my-version can actually discover the
      # project's version config (issue #1453) — for this layer, the [tool.bumpversion]
      # table in pyproject.toml, since python-core deliberately ships no .bumpversion.toml.
      # It ships as of v1.1.0; it stays off because the .rhiza/tests/test_pyproject.py this
      # layer also ships enforces the same invariant one gate later.
      # - id: check-bumpversion-config
      # check-template-bundles validates .rhiza/template.yml against the template repo's
      # remote bundle list, so it fires only when that file is staged — and unlike in the
      # mother repo (which has no template.yml) it is live in a synced project. Disabled in
      # #660 (rhiza-hooks 0.3.0) with no reason recorded.
      # - id: check-template-bundles
